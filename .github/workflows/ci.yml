name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eudr_core
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      EUDR_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/eudr_core
    defaults:
      run:
        working-directory: eudr_core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: eudr_core/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Build database with migrations
        run: python -m scripts.migrate
      - name: Run tests
        run: python -m pytest -q

  web:
    name: Web typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eudr_web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: eudr_web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
